StylesPath = tools/linting/styles
MinAlertLevel = warning

# Most of this repo is reference and operational material, so the higher
# punctuation budget is the default. Prose written for publication opts back
# into the short-form limit below.
# See tools/linting/README.md for why the two differ.
[*.md]
BasedOnStyles = TCG
TCG.Punctuation = NO
TCG.PunctuationReference = YES

# Style references are published posts, kept verbatim as a record of what went
# out. Some predate the anti-hype list and violate it. Editing them to satisfy a
# later rule would make this repo disagree with the live text, so the rule is off
# here.
[publishing/02-tools/style-references/**]
TCG.Punctuation = YES
TCG.PunctuationReference = NO
TCG.AntiHype = NO
TCG.RetiredTerms = NO


# The segmentation audit names the paths it proposes to move and quotes the
# retired axiom description it found in a field artifact. Same reason.
[SEGMENTATION-AUDIT.md]
TCG.RetiredTerms = NO
