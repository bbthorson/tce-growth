<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Axiom II: a deal needs a price both sides accept</title>
<desc id="figdesc">The buyer's surplus falls as price rises and the seller's rises with it. Before verification the two lines cross zero at the same price, 55, so no price leaves both positive and a discount only moves the deal along the axis. After verification lowers each side's expected future loss, the buyer's line shifts up and the seller's floor shifts down, and a shaded window from 49 to 67 opens where both say yes.</desc>
<style>
