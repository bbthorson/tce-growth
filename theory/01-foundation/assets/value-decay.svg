<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Value decays from the triggering event</title>
<desc id="figdesc">Two exponential decay curves falling from a peak perceived value of 100 toward a horizontal floor at 40, the value of the buyer's next best alternative. The curve driven by organizational inertia alone reaches the floor in the second month. The curve with a named external catalyst decays roughly five times more slowly and does not reach the floor until the eleventh. Below the floor the buyer keeps the status quo.</desc>
<style>
  :root {
    --ink: #16181d;
    --muted: #5d636e;
    --axis: #333740;
    --grid: #e3e5ea;
    --bg: #ffffff;
    --panel: #f7f8fa;
    --primary: #1f5f8b;
    --primary-fill: rgba(31, 95, 139, 0.13);
    --alert: #a4373a;
    --alert-fill: rgba(164, 55, 58, 0.11);
    --good: #1d6f52;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e9ebef;
      --muted: #a2a9b5;
      --axis: #99a0ac;
      --grid: #2f333b;
      --bg: #14161a;
      --panel: #1b1e24;
      --primary: #7fb6dd;
      --primary-fill: rgba(127, 182, 221, 0.17);
      --alert: #e58e90;
      --alert-fill: rgba(229, 142, 144, 0.15);
      --good: #6cc39c;
    }
  }
  .bg { fill: var(--bg); }
  .panel { fill: var(--panel); }
  .axis { stroke: var(--axis); stroke-width: 1.4; fill: none; }
  .grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  .curve { fill: none; stroke-width: 2.6; stroke-linejoin: round;
           stroke-linecap: round; }
  .primary { stroke: var(--primary); }
  .alert { stroke: var(--alert); }
  .good { stroke: var(--good); }
  .dashed { stroke-dasharray: 7 5; }
  .thin { stroke-width: 1.6; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
         "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .title { font-size: 19px; font-weight: 650; }
  .subtitle { font-size: 12.5px; fill: var(--muted); }
  .axis-label { font-size: 13px; fill: var(--muted); }
  .tick { font-size: 11.5px; fill: var(--muted); }
  .note { font-size: 12.5px; font-weight: 600; }
  .note-muted { font-size: 12px; fill: var(--muted); }
</style>
