extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: false
# NOTE ON VERSION NUMBERS IN THIS FILE. The comments below cite v13 through
# v19, which are the Constitution's PRE-RESET numbering, used while the
# framework was called Implementation-Led Growth. The count restarted at 1.0
# when it was renamed to Transaction Cost Growth. The old entries are kept in
# the Constitution's version history under their original numbers, so every
# reference here still resolves. Do not renumber them: the point of a retired
# term is that it records when something stopped being true.
#
# Retired axiom names. The canonical names live in
# theory/01-foundation/00-tcg-constitution.md Part I. Add a row here whenever an
# axiom is renamed, in the same commit as the Constitution version bump.
#
# The list below was completed by mining git history rather than by scanning the
# working tree, because a name fully purged before this rule existed leaves no
# trace to find. See the linting README for the command.
#
# Deliberately absent: "Law of Conservation". That is Tesler's Law quoted in
# prose in a published style reference, not a retired TCG axiom.
#
# Retired directory numbering. These paths never resolve; they appear in link
# text while the href alongside them is correct, so the link checker cannot see
# them. Add a row here whenever a directory is renumbered.
#
# Retired deal analogies (v14.0). Replaced by Structural Deal ($k \ge 10$) and
# Turnkey Deal ($k \le 9$) per the 2x2 Deal Archetype Matrix.
# Metric name. NRR is Net Revenue Retention, confirmed 2026-09. The expansion
# below is a common slip and has never appeared in the working tree, so this row
# is preventive rather than corrective, in the same spirit as the entries mined
# from git history above. Canonical definition: 04-glossary-and-notation.md.
# Retired Constitution sections (v15.0). Clarifying Concepts was deleted as a
# third home for definitions that already had a research file and a glossary
# row. Part IV moved to practice/07-variable-ownership.md. Both
# names survive only inside link text, where hrefs stay valid and the link
# checker cannot see the staleness. Keys are scoped to the link-text shape on
# purpose, the way the v14.0 analogies avoid bare "Bridge" and "Toaster", so the
# Constitution's own version history can still name what it retired.
# Retired directory (v15.0). practice/03-learning-plan/ was removed: an
# LLM-facilitated curriculum restating theory/ in parallel, with nothing linking
# a module to the axiom it taught, so an axiom revision could not reach it. The
# 2x2 matrix in module-0 had already drifted from 01-motion-taxonomy.md.
# Superseded Axiom I description (v16.0). The axiom name did not change, so
# nothing here catches a paragraph that uses every current term while describing
# the pre-v16 version. These two phrases are the load-bearing ones.
# Retired instrument names (2026-09). "Risk Calculator" was an early name for
# this instrument and survived in three operational files after every link to it
# had been corrected. "Process Calculator" was the name that won a count of
# references in 2026-09 and lost the argument in v17.0: the instrument stopped
# emitting a motion label and started emitting a level and a direction, which is
# a triage output and not a process one. The keys below are scoped to the link
# and path shapes on purpose, the way the v15.0 entries are, so version history
# can still name what it retired. Bare "Process Calculator" in prose is
# therefore uncaught, which is the same trade the v15.0 rows make. Note that
# swap keys are regular expressions: the dot in the path is escaped, and a key
# opening with a bracket would never match, because the rule anchors on word
# boundaries.
#
# Retired archetype names (v14.0, row added 2026-09). "Lane 1" and "Lane 2"
# predate the Turnkey and Structural archetypes and survived the same way. Both
# are the exact failure this rule exists to catch, and both went uncaught
# because nobody added the rows at the time of the rename.
# Retired notation (v17.0). The reduced form was written with a bare x defined
# as "approximately Delta_A", which is the raw scorecard score. Section 1.5 has
# required the normalised value since before that wording was written, and
# tcg_models.py refuses a raw one at the type level, so the Constitution's own
# statement of the equation carried the exact error the module exists to
# prevent. The row catches the LaTeX shape rather than the letter x, which is
# still legitimate as x_m in the milestone chain.
#
# Superseded Axiom II description (v17.0). The axiom name did not change, so
# nothing here catches a paragraph that uses every current term while describing
# the single-multiplier version. These are the load-bearing phrases from the
# form that per-component amplification replaced.
# Framework rename (v18.0). Implementation-Led Growth named the whole framework
# and named one of the four motions inside it. v17.0 made a motion a region of
# the friction vector's space, which left the framework named after one of its
# own regions. The framework is Transaction Cost Growth; ILG keeps its name as
# the implementation-dominant motion.
#
# This is why bare "ILG" and bare "Implementation-Led Growth" are NOT retired
# here: both are still correct when they name the motion. The keys below are
# scoped to the shapes that could only ever have meant the framework, which is
# the same trade the v15.0 and v17.0 rows make. A reviewer still has to read
# descriptions, not just names.
# Motion taxonomy (v1.0). The three inherited names were named on three
# different axes: Product-Led after the instrument, Sales-Led after the actor,
# Implementation-Led after the cost component. Only the last names a cost,
# which is why Search-Led Growth and Consensus-Led Growth had nowhere to sit.
# Every motion is now named after the cost it spends to reduce, and the short
# vector takes the deal class's own word.
#
# The acronyms are retired rather than rebased, because SLG would otherwise
# mean Search-Led here and Sales-Led everywhere else. 09-motion-vocabulary.md
# carries the map, so the incumbent terms stay findable without being live.
